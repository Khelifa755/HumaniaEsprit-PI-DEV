knp_paginator:
    page_range: 5                       # nombre de pages visibles autour de la page courante
    default_options:
        page_name:             page      # param URL pour la page courante
        sort_field_name:       sort      # param URL pour le tri
        sort_direction_name:   direction # param URL pour la direction du tri
        distinct:              true      # SELECT DISTINCT pour éviter les doublons
        filter_field_name:     filterField
        filter_value_name:     filterValue
    template:
        # On n'utilise PAS le template Twig de KNP — pagination gérée
        # dans les templates via macro custom (catalog) et blocs Twig (matrice).
        # Ces lignes restent pour la compatibilité si vous appelez
        # knp_pagination_render() ailleurs.
        pagination: '@KnpPaginator/Pagination/bootstrap_v5.html.twig'
        sortable:   '@KnpPaginator/Pagination/sortable_link.html.twig'
        filtration: '@KnpPaginator/Filtration/filtration.html.twig'